@if (ready()) {
  @let _drawingId = drawingId();
  @if (_drawingId) {
    <app-drawing [drawingId]="_drawingId" (close)="drawingId.set(null)"></app-drawing>
  } @else {
    <app-drawings (drawingIdSelected)="drawingId.set($event)"></app-drawings>
  }
} @else if (initializationError()) {
  <div style="padding: 24px; color: red;">
    <p>{{initializationError()}}</p>
    <button class="azure-devops-button azure-devops-button-secondary" type="button" (click)="ngOnInit()">Retry</button>
  </div>
}
