<button class="btn" (click)="toggle()">
    <span class="icon"></span>
</button>

@if (open()) {
<div class="menu">
    @if (canCreateDrawing()) {
    <button class="item" (click)="onCreateDrawing()">New Drawing</button>
    }
    <button class="item" (click)="onRename()">Rename/move</button>
    @if (canDelete()) {
    <button class="item" (click)="onDelete()">Delete</button>
    }
</div>
}
